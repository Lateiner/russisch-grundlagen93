<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pluralia-Tantum-Paarung</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --success-color: #28a745;
            --error-color: #dc3545;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        h1 { font-size: 1.5rem; color: #333; }

        .instruction {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            border: 1px solid #ddd;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            user-select: none;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .image-card { font-size: 2.5rem; }

        /* Zustände */
        .match-card.selected {
            border-color: var(--primary-color);
            background-color: #e7f1ff;
            transform: scale(1.03);
        }

        .match-card.completed {
            background-color: var(--success-color);
            border-color: var(--success-color);
            color: white;
        }

        .match-card.fade-out {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .match-card.error {
            animation: shake 0.4s ease;
            border-color: var(--error-color);
            background-color: #f8d7da;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .reset-btn {
            padding: 12px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        @media (max-width: 500px) {
            .game-grid { gap: 10px; }
            .match-card { font-size: 0.95rem; padding: 10px; }
            .image-card { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Übung: Pluralia Tantum</h1>
    
    <p class="instruction">
        Einige Wörter existieren im Russischen nur im Plural. Verbinde das Bild mit der korrekten Phrase. <br>
        <strong>Anleitung:</strong> Klicke ein Bild an und danach den passenden Text.
    </p>

    <div class="game-grid">
        <div class="column" id="images-col"></div>
        <div class="column" id="words-col"></div>
    </div>

    <button class="reset-btn" onclick="initGame()">Neu starten</button>
</div>

<script>
    const data = [
        { id: 1, img: "✂️", text: "двое ножниц" },
        { id: 2, img: "👖", text: "трое брюк" },
        { id: 3, img: "👓", text: "двое очков" },
        { id: 4, img: "⌚", text: "четверо часов" },
        { id: 5, img: "🚪", text: "двое ворот" },
        { id: 6, img: "🛷", text: "двое саней" },
        { id: 7, img: "📅", text: "трое суток" },
        { id: 8, img: "🗜️", text: "двое клещей" }
    ];

    let selectedImgEl = null;

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
        const imgCol = document.getElementById('images-col');
        const wordCol = document.getElementById('words-col');
        imgCol.innerHTML = '';
        wordCol.innerHTML = '';
        selectedImgEl = null;

        // Bilder mischen
        shuffle([...data]).forEach(item => {
            const div = document.createElement('div');
            div.className = 'match-card image-card';
            div.textContent = item.img;
            div.dataset.id = item.id;
            div.onclick = () => selectImg(div);
            imgCol.appendChild(div);
        });

        // Texte mischen
        shuffle([...data]).forEach(item => {
            const div = document.createElement('div');
            div.className = 'match-card';
            div.textContent = item.text;
            div.dataset.matchId = item.id;
            div.onclick = () => selectWord(div);
            wordCol.appendChild(div);
        });
    }

    function selectImg(el) {
        if (el.classList.contains('completed') || el.classList.contains('fade-out')) return;
        document.querySelectorAll('.image-card').forEach(c => c.classList.remove('selected'));
        selectedImgEl = el;
        el.classList.add('selected');
    }

    function selectWord(wordEl) {
        if (!selectedImgEl || wordEl.classList.contains('completed')) return;

        if (selectedImgEl.dataset.id === wordEl.dataset.matchId) {
            // Erfolg
            const imgEl = selectedImgEl;
            imgEl.classList.add('completed');
            wordEl.classList.add('completed');
            imgEl.classList.remove('selected');
            selectedImgEl = null;

            setTimeout(() => {
                imgEl.classList.add('fade-out');
                wordEl.classList.add('fade-out');
                checkWin();
            }, 600);
        } else {
            // Fehler
            wordEl.classList.add('error');
            setTimeout(() => wordEl.classList.remove('error'), 400);
        }
    }

    function checkWin() {
        const remaining = document.querySelectorAll('.match-card:not(.fade-out)').length;
        if (remaining === 0) {
            setTimeout(() => alert("Отлично! Du hast alle Pluralia-Tantum-Paare gefunden."), 300);
        }
    }

    initGame();
</script>

</body>
</html>
