<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronomen-Check: Sammelzahlwörter</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --success-color: #28a745;
            --error-color: #dc3545;
            --bg-color: #f4f7f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h1 { font-size: 1.5rem; color: #333; margin-bottom: 10px; }

        .instruction {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            border: 1px solid #ddd;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .game-grid { gap: 10px; }
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            user-select: none;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Zustände */
        .match-card.selected {
            border-color: var(--primary-color);
            background-color: #e7f1ff;
            transform: scale(1.02);
        }

        .match-card.completed {
            background-color: var(--success-color);
            border-color: var(--success-color);
            color: white;
            cursor: default;
        }

        .match-card.fade-out {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .match-card.error {
            animation: shake 0.4s ease;
            border-color: var(--error-color);
            background-color: #f8d7da;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .reset-btn {
            padding: 12px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        @media (max-width: 500px) {
            .match-card { font-size: 0.95rem; padding: 10px 5px; }
            h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Pronomen & Zahlwörter</h1>
    
    <p class="instruction">
        Ordne die russischen Sätze ihrer deutschen Bedeutung zu. <br>
        <strong>Anleitung:</strong> Klicke einen russischen Satz an und danach die deutsche Übersetzung.
    </p>

    <div class="game-grid">
        <div class="column" id="russian-col"></div>
        <div class="column" id="german-col"></div>
    </div>

    <button class="reset-btn" onclick="initGame()">Neu starten</button>
</div>

<script>
    const data = [
        { id: 1, ru: "Нас двое", de: "Wir sind zu zweit" },
        { id: 2, ru: "Вас трое", de: "Ihr seid zu dritt" },
        { id: 3, ru: "Их четверо", de: "Sie sind zu viert" },
        { id: 4, ru: "Нас пяtero", de: "Wir sind zu fünft" },
        { id: 5, ru: "Вас шестеро", de: "Ihr seid zu sechst" },
        { id: 6, ru: "Их семеро", de: "Sie sind zu siebt" },
        { id: 7, ru: "Нас восьмеро", de: "Wir sind zu acht" },
        { id: 8, ru: "Их десятеро", de: "Sie sind zu zehnt" }
    ];

    let selectedRuEl = null;

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
        const ruCol = document.getElementById('russian-col');
        const deCol = document.getElementById('german-col');
        ruCol.innerHTML = '';
        deCol.innerHTML = '';
        selectedRuEl = null;

        // Russische Spalte
        shuffle([...data]).forEach(item => {
            const div = document.createElement('div');
            div.className = 'match-card';
            div.textContent = item.ru;
            div.dataset.id = item.id;
            div.onclick = () => selectRu(div);
            ruCol.appendChild(div);
        });

        // Deutsche Spalte
        shuffle([...data]).forEach(item => {
            const div = document.createElement('div');
            div.className = 'match-card';
            div.textContent = item.de;
            div.dataset.matchId = item.id;
            div.onclick = () => selectDe(div);
            deCol.appendChild(div);
        });
    }

    function selectRu(el) {
        if (el.classList.contains('completed') || el.classList.contains('fade-out')) return;
        document.querySelectorAll('#russian-col .match-card').forEach(c => c.classList.remove('selected'));
        selectedRuEl = el;
        el.classList.add('selected');
    }

    function selectDe(deEl) {
        if (!selectedRuEl || deEl.classList.contains('completed')) return;

        if (selectedRuEl.dataset.id === deEl.dataset.matchId) {
            // Erfolg
            const ruEl = selectedRuEl;
            ruEl.classList.add('completed');
            deEl.classList.add('completed');
            ruEl.classList.remove('selected');
            selectedRuEl = null;

            setTimeout(() => {
                ruEl.classList.add('fade-out');
                deEl.classList.add('fade-out');
                checkWin();
            }, 600);
        } else {
            // Fehler
            deEl.classList.add('error');
            setTimeout(() => deEl.classList.remove('error'), 400);
        }
    }

    function checkWin() {
        const remaining = document.querySelectorAll('.match-card:not(.fade-out)').length;
        if (remaining === 0) {
            setTimeout(() => alert("Отлично! Du hast alle Kombinationen richtig zugeordnet."), 300);
        }
    }

    initGame();
</script>

</body>
</html>
